{% extends "base.html" %}

{% block title %}{{ team_name }}{% endblock %}

{% block content %}
<style>
    .team-info {
        max-width: 500px;
        margin: 0 auto;
        font-size: 18px;
    }
    .team-info h2 {
        text-align: center;
        color: #4B0082; /* Dark purple */
        font-size: 32px;
        margin-bottom: 30px;
    }
    .team-info h3 {
        color: #4B0082; /* Dark purple */
        font-size: 24px;
        margin-top: 20px;
    }
    .team-info ul {
        list-style-type: none;
        padding: 0;
    }
    .team-info li {
        margin-bottom: 10px;
        color: #000000; /* Black for member details */
    }
    .donate-button {
        display: block;
        width: 100%;
        padding: 15px;
        background-color: #4B0082; /* Dark purple */
        color: white;
        text-align: center;
        text-decoration: none;
        border-radius: 5px;
        font-size: 20px;
        margin-top: 30px;
    }
    .donate-button:hover {
        background-color: #8A2BE2; /* Lighter purple on hover */
    }
</style>

<div class="team-info">
    <h2>{{ team_name }}</h2>
    <h3>Team Members:</h3>
    <ul>
    {% for member in members %}
        <li>{{ member['name'] }} - {{ member['cancer_type'] }}</li>
    {% endfor %}
    </ul>
    <a href="https://www.gofundme.com/your-5k-event-page" class="donate-button">Donate to Our Team</a>
</div>
{% endblock %}
